<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Scan Absensi</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body{margin:0;font-family:system-ui;background:#363636;color:#fff}
    #reader{width:100%;max-width:400px;margin:auto}
    #result{text-align:center;margin-top:1em;font-size:1.2em}
    #demoButton{display:none;margin:1em auto;padding:.7em 1em;border:0;border-radius:6px;background:#04aa6d;color:#fff;cursor:pointer}

    .body {
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="reader"></div>
  <div id="result">Arahkan kamera ke QR Code</div>
  <button id="demoButton" type="button">Simulasikan scan Nama Teman</button>

  <script>
    const resultDiv = document.getElementById('result');
    const demoMode = new URLSearchParams(location.search).get('mode') === 'test';
    const demoButton = document.getElementById('demoButton');
    let last = '';
    function onScanSuccess(decodedText) {
      if (decodedText === last) return;
      last = decodedText;
      let student = { nama: decodedText, kelas: '-' };
      try { student = JSON.parse(decodedText); } catch (_) { }
      saveLocalAttendance(student);
      fetch('../api.php?action=absen', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': 'absen2026'
        },
        body: JSON.stringify({ qr_id: decodedText })
      })
      .then(r => r.json())
      .then(data => {
        finishScan(student, data.message || 'Berhasil tersimpan');
      })
      .catch(() => {
        finishScan(student, 'Tersimpan lokal');
      });
    }
    function finishScan(student, message) {
      resultDiv.textContent = `${message}: ${student.nama}. Membuka daftar absensi...`;
      setTimeout(() => { location.href = 'index.html?scan=success'; }, 700);
    }
    function saveLocalAttendance(student) {
      const attendance = JSON.parse(localStorage.getItem('absensi') || '[]');
      const now = new Date();
      attendance.push({
        absen_id: Date.now(),
        tanggal: now.toISOString().slice(0, 10),
        jam: now.toLocaleTimeString('id-ID'),
        nama: student.nama || 'Nama Teman',
        kelas: student.kelas || '-'
      });
      localStorage.setItem('absensi', JSON.stringify(attendance));
    }
    if (demoMode) {
      demoButton.style.display = 'block';
      demoButton.addEventListener('click', () => {
        last = '';
        onScanSuccess(JSON.stringify({ nama: 'Nama Teman', kelas: 'XII RPL' }));
      });
    }
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onScanSuccess);
  </script>
</body>
</html>
